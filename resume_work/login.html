<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="login.css">
    <title>Login Page</title>
</head>

<body>

</body>

<div class="Page">
    <div class="Login">
        <h1>Login</h1>
        <form action="/login" method="post">
            <label for="username">Username</label>

            <input type="text" id="username" name="username" required placeholder="Email Phone Number "><br><br>

            <label for="password">Password</label>

            <input type="password" id="password" name="password" required placeholder="Password"><br><br>

            <button class="submit" value="Login">
                Login
            </button>
            <br>
            <h5>Forgot Password? <a href="/forgot-password">Click Here</a></h5>
            <br>
            <h4>Don't have an account? <a href="/signup">Sign Up</a></h4>

        </form>
    </div>
</div>


</html>
